<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Beto Assim & Assado</title>
    <meta name="description" content="Beto Assim & Assado — Lagoa Santa" />
    <meta name="theme-color" content="#084025" />
    <link rel="icon" type="image/png" href="images/logo/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topo" id="topo">
      <div class="topo__barra">
        <a href="#inicio" class="topo__marca" aria-label="Início">
          <img id="logo-topo" width="565" height="389" />
        </a>
        <nav class="topo__nav" id="menu" aria-label="Principal">
          <a href="#cardapio" data-secao="cardapio">Cardápio</a>
          <a href="#galeria" data-secao="galeria">Galeria</a>
          <a href="#contato" data-secao="contato">Contato</a>
        </nav>
        <a class="botao botao--ouro botao--pequeno topo__cta" data-acao="reserva">Reservar mesa</a>
        <button class="topo__menu" id="botao-menu" aria-expanded="false" aria-controls="menu" aria-label="Abrir menu">
          <span></span><span></span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero" id="inicio">
        <figure class="hero__foto" id="hero-foto"></figure>
        <div class="hero__conteudo">
          <img class="hero__logo" id="logo-hero" width="565" height="389" />
          <div class="acoes">
            <a class="botao botao--ouro" data-acao="reserva">Reservar mesa</a>
            <a class="botao botao--contorno" data-acao="ifood">Pedir no iFood</a>
          </div>
          <a class="whats-linha" data-acao="whatsapp">
            <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icone-whats" /></svg>
            <span data-whats-texto>WhatsApp</span>
          </a>
        </div>
      </section>

      <section class="secao secao--creme" id="cardapio">
        <header class="secao__cabeca">
          <p class="sobretitulo">Da chapa para a mesa</p>
          <h2>Cardápio</h2>
        </header>
        <div class="pratos" id="lista-pratos"></div>
      </section>

      <section class="secao secao--escura" id="galeria">
        <header class="secao__cabeca">
          <p class="sobretitulo">Da nossa cozinha</p>
          <h2>Galeria</h2>
        </header>
        <div class="galeria" id="lista-galeria"></div>
      </section>

      <section class="secao secao--creme contato" id="contato">
        <div class="contato__cartao">
          <header class="secao__cabeca">
            <p class="sobretitulo">Lagoa Santa</p>
            <h2>Reservas e pedidos</h2>
          </header>
          <div class="acoes acoes--centro">
            <a class="botao botao--ouro" data-acao="reserva">Reservar mesa</a>
            <a class="botao botao--escuro" data-acao="ifood">Pedir no iFood</a>
          </div>
          <dl class="contato__dados" id="dados-contato"></dl>
        </div>
      </section>
    </main>

    <footer class="rodape">
      <img id="logo-rodape" width="565" height="389" />
      <p>Beto Assim &amp; Assado · Lagoa Santa</p>
    </footer>

    <!-- Barra fixa de ações no celular -->
    <nav class="barra-movel" aria-label="Ações rápidas">
      <a data-acao="reserva">Reservar</a>
      <a data-acao="ifood">iFood</a>
      <a data-acao="whatsapp" class="barra-movel__whats">
        <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icone-whats" /></svg>
        WhatsApp
      </a>
    </nav>

    <!-- Botão flutuante de WhatsApp (desktop) -->
    <a class="whats-flutuante" data-acao="whatsapp" aria-label="Conversar no WhatsApp">
      <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icone-whats" /></svg>
    </a>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="icone-whats" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M12 2a9.9 9.9 0 0 0-8.5 15l-1.4 5 5.2-1.4A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"
        />
      </symbol>
    </svg>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
